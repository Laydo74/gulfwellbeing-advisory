name: Export final project ZIP

on:
  push:
    branches:
      - export/gulfwellbeing-final-20260926

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8930c3eb970085fc6cc096737e5b2f7e240fc633
          fetch-depth: 1
      - name: Create ZIP
        run: |
          zip -r /tmp/gulfwellbeing-final.zip .             -x ".git/*"             -x ".env"             -x "node_modules/*"             -x ".github/workflows/export-final-zip.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: gulfwellbeing-final-20260926
          path: /tmp/gulfwellbeing-final.zip
          retention-days: 7
